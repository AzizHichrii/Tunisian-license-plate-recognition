experiment: TLPR_OCR
epochs: 100
batch: 32
lr: 0.001
weight_decay: 0.0001
patience: 20          # early stopping (val exact match); LR scheduler follows val loss
hidden: 128
seed: 42
out_dir: runs/ocr/crnn
seq_len: 64           # 32 = baseline, 64 = more room for repeated chars
strong_aug: true      # experiment B: perspective, noise, low-resolution
