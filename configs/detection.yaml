experiment: TLPR_Detection
data: data/processed/detection/data.yaml
model: yolov8n.pt      # baseline: smallest YOLOv8
imgsz: 640             # chosen from the EDA
epochs: 50
batch: 8               # fits in 4 GB VRAM
patience: 15           # stop if no progress for 15 epochs
seed: 42
device: 0              # GPU
workers: 2             # Windows: keep low
project: runs/detection